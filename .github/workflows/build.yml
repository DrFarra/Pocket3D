name: Build
on: [push, pull_request]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Compila para dispositivo (las APIs de LiDAR/RoomPlan no existen en el simulador).
      - run: xcodebuild -project Pocket3D.xcodeproj -target Pocket3D -sdk iphoneos -configuration Debug CODE_SIGNING_ALLOWED=NO build
